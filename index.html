<!DOCTYPE html>
<html lang="en" data-i18n-title="page.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Tutor</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/letter.css">
  <link rel="stylesheet" href="css/site.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem("pocket-tutor-lang") === "zh") {
          document.documentElement.lang = "zh-Hans";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="page-marketing">
  <header class="whisper">
    <h1 class="wordmark"><a class="wordmark" href="#top" data-i18n="brand">Pocket Tutor</a></h1>
    <div class="whisper-end">
      <a class="entry" href="kid.html" data-i18n="nav.try">Try a lesson</a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <span class="lang-switch-sep" aria-hidden="true">/</span>
        <button type="button" data-lang="zh" aria-pressed="false">中</button>
      </div>
    </div>
  </header>

  <section class="canvas" id="top">
    <img class="canvas-art" src="assets/illustrations/homepage-hero-locked-2026-11-13.jpg" width="1280" height="720" alt="A child seen from the side, sitting on a grassy hill with the cream screen robot, looking out at a storybook world of books, a ferris wheel, and a castle" data-i18n-alt="alt.hero">
  </section>

  <section class="intro" id="intro">
    <h2 class="intro-title" data-i18n="hero.title">Ask or snap a problem</h2>
    <p class="lede" data-i18n="hero.lede">Practice after the lesson, and parents get a summary of this session.</p>
    <a class="cta" href="kid.html" data-i18n="hero.cta">Try a lesson</a>
  </section>

  <section class="story" id="jiaoyu">
    <header class="story-header">
      <h2 class="story-title" data-i18n="jiaoyu.title">Playful learning, clearly structured</h2>
    </header>
    <article class="leaf">
      <img class="leaf-art" src="assets/illustrations/learning-path.jpg" width="1280" height="720" alt="A cream screen robot on a forked dirt path, with colored flags marking different routes across the hills" data-i18n-alt="alt.path">
      <h3 class="leaf-title" data-i18n="jiaoyu.card1">A path for every student</h3>
    </article>
    <article class="leaf">
      <img class="leaf-art" src="assets/illustrations/talk-to-learn.jpg" width="1280" height="720" alt="A child seen from behind, talking to the cream screen robot, empty speech bubbles in the air" data-i18n-alt="alt.talk">
      <h3 class="leaf-title" data-i18n="jiaoyu.card2">Talk &amp; Learn</h3>
    </article>
    <article class="leaf">
      <img class="leaf-art" src="assets/illustrations/practice-anywhere.jpg" width="1280" height="720" alt="The cream screen robot beside three small scenes: a desk with a workbook, a window looking out, and a grassy patch with a ball" data-i18n-alt="alt.anywhere">
      <h3 class="leaf-title" data-i18n="jiaoyu.card3">Practice anywhere</h3>
    </article>
  </section>



  <footer class="site-footer">
    <p class="brand" data-i18n="brand">Pocket Tutor</p>
    <nav>
      <a href="kid.html" data-i18n="nav.try">Try a lesson</a>
      <a href="parent.html" data-i18n="nav.parent">Parent summary</a>
    </nav>
  </footer>

  <script src="js/i18n.js"></script>
</body>
</html>
