<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口袋教师</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/letter.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="page-marketing">
  <header class="whisper">
    <h1 class="wordmark"><a class="wordmark" href="#top">口袋教师</a></h1>
    <a class="entry" href="kid.html">试一次讲解</a>
  </header>

  <section class="shot shot-hero" id="top">
    <h2 class="visually-hidden">一台轻薄手持</h2>
    <img class="still" src="assets/photos/hero-idle.jpg" width="1920" height="1080" alt="口袋教师，一块浅灰等厚竖板，闲时脸上两点和一条嘴，右侧是青键和薄滚轮">
  </section>

  <section class="shot shot-macro" id="edge">
    <h2 class="visually-hidden">约九毫米等厚，右侧青键与薄滚轮</h2>
    <img class="still" src="assets/photos/macro-edge.jpg" width="1920" height="1080" alt="侧面特写：约九毫米等厚的机身，右侧一枚薄滚轮和一颗青绿按键，顶底有磁吸触点" loading="lazy">
  </section>

  <section class="shot shot-name" id="name">
    <img class="still" src="assets/photos/still-name.jpg" width="1920" height="1080" alt="" loading="lazy">
    <div class="name-layer">
      <p class="product">口袋教师</p>
      <p class="lede">开口或拍题，讲完再练，家长收到这一次的摘要</p>
      <a class="cta" href="kid.html">试一次讲解</a>
    </div>
  </section>

  <section class="shot shot-acc" id="cradle">
    <h2 class="visually-hidden">桌面座</h2>
    <img class="still" src="assets/photos/cradle.jpg" width="1920" height="1080" alt="薄机斜承在一只浅灰桌面座上，约二十度" loading="lazy">
    <p class="acc-caption">桌面座</p>
  </section>

  <section class="shot shot-acc" id="camera">
    <h2 class="visually-hidden">摄像头模组</h2>
    <img class="still" src="assets/photos/camera-puck.jpg" width="1920" height="1080" alt="一只安静的浅灰镜头模组，底部有四个磁吸触点" loading="lazy">
    <p class="acc-caption">摄像头模组</p>
  </section>

  <section class="shot shot-acc" id="diy">
    <h2 class="visually-hidden">DIY 示例</h2>
    <img class="still" src="assets/photos/diy-ears.jpg" width="1920" height="1080" alt="用户可自己做的猫耳摄像头示例，不是品牌默认" loading="lazy">
    <p class="acc-caption">DIY 示例</p>
  </section>

  <section class="shot shot-letter" id="letter">
    <article class="letter" data-ui>
      <h2>这次学习摘要</h2>
      <p class="meta">11月12日 · 开口 · 约8分钟</p>
      <div class="block">
        <p class="label">问了什么</p>
        <p class="body">解方程 2x + 3 = 11</p>
      </div>
      <div class="block">
        <p class="label">怎么讲的</p>
        <p class="body">先移项再除系数，再用原式验算。</p>
      </div>
      <div class="foot">
        <span class="score">3 / 4</span>
        <p class="next">下一题建议：带括号的一步方程</p>
      </div>
    </article>
    <footer class="site-footer">
      <p class="brand">口袋教师</p>
      <nav>
        <a href="kid.html">试一次讲解</a>
        <a href="parent.html">家长摘要</a>
      </nav>
    </footer>
  </section>
</body>
</html>
