<!DOCTYPE html>
<html lang="en" data-i18n-title="page.title.kid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pocket Tutor is a small device that helps a child ask a question or snap a problem, practice after the lesson, and send a short summary to parents." data-i18n-content="page.description">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://pocket-tutor-preview.onrender.com/kid.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pocket Tutor">
  <meta property="og:title" content="A lesson · Pocket Tutor" data-i18n-content="brand">
  <meta property="og:description" content="Pocket Tutor is a small device that helps a child ask a question or snap a problem, practice after the lesson, and send a short summary to parents." data-i18n-content="page.description">
  <meta property="og:url" content="https://pocket-tutor-preview.onrender.com/kid.html">
  <meta property="og:image" content="https://pocket-tutor-preview.onrender.com/assets/illustrations/homepage-hero-locked-2026-11-13.jpg">
  <meta property="og:image:alt" content="A child seen from the side, sitting on a grassy hill with the cream screen robot, looking out at a storybook world of books, a ferris wheel, and a castle" data-i18n-content="alt.hero">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A lesson · Pocket Tutor" data-i18n-content="brand">
  <meta name="twitter:description" content="Pocket Tutor is a small device that helps a child ask a question or snap a problem, practice after the lesson, and send a short summary to parents." data-i18n-content="page.description">
  <meta name="twitter:image" content="https://pocket-tutor-preview.onrender.com/assets/illustrations/homepage-hero-locked-2026-11-13.jpg">
  <title>Lesson · Pocket Tutor</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/device.css">
  <link rel="stylesheet" href="css/site.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem("pocket-tutor-lang") === "zh") {
          document.documentElement.lang = "zh-Hans";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="page-kid">
  <header class="topbar">
    <a href="index.html" data-i18n="brand">Pocket Tutor</a>
    <div class="whisper-end">
      <span class="quiet" id="phase-label">Idle</span>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <span class="lang-switch-sep" aria-hidden="true">/</span>
        <button type="button" data-lang="zh" aria-pressed="false">中</button>
      </div>
    </div>
  </header>

  <main class="kid-main">
    <div class="device-frame">
      <div class="slab" data-ui id="slab">
        <div class="slab-front">
          <div class="bezel" id="bezel" data-listening="false">
            <div class="screen" id="screen" role="img" aria-live="polite"></div>
          </div>
          <span class="led" aria-hidden="true"></span>
        </div>
        <div class="slab-edge" aria-hidden="true"></div>
        <button class="wheel" id="wheel" type="button" aria-label="Wheel, see the next step" data-i18n-aria="kid.wheel">
          <span class="wheel-ring"></span>
          <span class="wheel-hub"></span>
        </button>
        <button class="press" id="press" type="button" aria-label="Press to speak" data-i18n-aria="kid.key"></button>
      </div>
    </div>
    <p class="device-caption" id="device-caption">Press the teal key on the right to speak</p>
    <button class="step-btn" id="next-btn" type="button">Next</button>
    <nav class="kid-links">
      <a href="parent.html" data-i18n="nav.parent">Parent summary</a>
      <a href="kid.html?step=idle" data-i18n="nav.restart">Start over</a>
    </nav>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/session.js"></script>
</body>
</html>
